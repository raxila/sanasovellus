<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.googleapis.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://www.google.com https://*.googleusercontent.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;">
    <title>Englannin Sanakoe - Harjoittele sanoja!</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary-color: #4A90E2; --secondary-color: #FF9F1C; --success-color: #2EC4B6; --danger-color: #E71D36; --bg-color: #F4F7F6; --card-bg: #FFFFFF; --text-color: #2B2D42; --border-radius: 16px; }
        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif, system-ui; }
        body { background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #app { background: var(--card-bg); width: 100%; max-width: 800px; border-radius: var(--border-radius); box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 25px; position: relative; overflow: hidden; }
        h1, h2, h3 { text-align: center; color: var(--primary-color); margin-top: 0; }
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: transform 0.1s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin: 5px; text-decoration: none; }
        .btn:hover { transform: scale(1.03); filter: brightness(1.08); }
        .btn-secondary { background-color: var(--secondary-color); } .btn-success { background-color: var(--success-color); } .btn-danger { background-color: var(--danger-color); } .btn-dark { background-color: #333; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #EEE; padding-bottom: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .score-bar { display: flex; justify-content: space-around; background: #EFF6FF; padding: 10px; border-radius: 12px; margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; }
        .view { display: none; } .view.active { display: block; }
        .table-container { max-height: 350px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #DDD; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 10px; border-bottom: 1px solid #EEE; text-align: left; } th { background-color: #EBF3FF; position: sticky; top: 0; z-index: 2; }
        input[type="text"], select { width: 100%; padding: 10px; border: 2px solid #DDD; border-radius: 8px; font-size: 1rem; outline: none; margin-bottom: 8px; }
        input[type="text"]:focus, select:focus { border-color: var(--primary-color); }
        .card-container { perspective: 1000px; width: 100%; height: 220px; margin: 20px 0; cursor: pointer; user-select: none; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: var(--border-radius); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
        .card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: var(--border-radius); font-size: 2rem; font-weight: bold; padding: 20px; text-align: center; }
        .card-front { background: #E0F2FE; color: #0369A1; } .card-back { background: #FEF3C7; color: #B45309; transform: rotateY(180deg); }
        .hint-box { font-size: 1.8rem; letter-spacing: 5px; background: #F3F4F6; padding: 15px; border-radius: 12px; margin: 10px 0; text-align: center; font-weight: bold; color: #4B5563; }
        #gameCanvas { background: #1E293B; border-radius: 12px; display: block; margin: 0 auto; width: 100%; max-width: 600px; height: 350px; touch-action: none; }
        .cloud-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; background: #E2E8F0; color: #475569; }
        .cloud-badge.online { background: #DCFCE7; color: #15803D; } .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #94A3B8; } .cloud-badge.online .badge-dot { background: #22C55E; }
        .history-list { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 12px; background: #F8FAFC; margin-bottom: 6px; border-radius: 8px; font-size: 0.95rem; border-left: 4px solid var(--primary-color); }
        .status-msg { padding: 12px; border-radius: 10px; margin: 12px 0; font-weight: bold; text-align: center; display: none; font-size: 1.1rem; }
        .star-rating { color: #F59E0B; letter-spacing: 2px; }
        .user-chip { display:inline-flex; align-items:center; gap:5px; background:#FEF3C7; color:#B45309; padding:5px 12px; border-radius:20px; font-weight:bold; font-size:0.9rem; border:1px solid #FDE68A; }
        
        /* SEIKKAILUREITTI-KORTTI */
        .quest-card { background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); border: 2px solid #C7D2FE; border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .quest-title { font-size: 1.2rem; font-weight: bold; color: #3730A3; margin: 0 0 5px 0; }
        .quest-status { font-size: 0.95rem; color: #4F46E5; margin-bottom: 25px; }
        .quest-track { position: relative; width: 100%; height: 35px; background: #CBD5E1; border-radius: 20px; display: flex; align-items: center; }
        .quest-fill { position: absolute; left: 0; top: 0; height: 100%; background: linear-gradient(90deg, #60A5FA, #818CF8); border-radius: 20px; width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px rgba(99,102,241,0.5); }
        .quest-milestones { position: absolute; width: 100%; left: 0; display: flex; justify-content: space-between; padding: 0 15px; z-index: 2; font-size: 1.6rem; transform: translateY(-3px); }
        .quest-player { position: absolute; left: 0%; top: -25px; font-size: 2.2rem; z-index: 3; transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-50%); filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2)); }
        
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }
        .recording { animation: pulse 1.5s infinite; background-color: #DC2626 !important; color: white; }
    </style>
</head>
